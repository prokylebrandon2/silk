[package]
name = "silk-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Silk core: vault format, key derivation, TOTP and autofill matching"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
getrandom = "0.2"
hmac = "0.12"
kiln-skln = { git = "https://github.com/prokylebrandon2/kiln-rust", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
